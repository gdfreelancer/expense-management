name: Build iOS Simulator App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository currently contains only the Android platform folder.
      # Generate the iOS runner project on the CI machine without changing
      # or committing generated files back to the repository.
      - name: Generate iOS platform project
        run: flutter create --platforms=ios --org com.example --project-name expense_management .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug

      - name: Package Simulator app
        run: |
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" expense-management-ios-simulator.zip

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: expense-management-ios-simulator
          path: expense-management-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
