name: Create Flutter Android App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-flutter-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project for Android
        run: flutter create --platforms=android --project-name expense_management .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit generated Flutter project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Create Flutter Android application"
            git push origin HEAD:main
          fi
